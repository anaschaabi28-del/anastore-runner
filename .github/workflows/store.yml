name: anastore
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: anastore
  cancel-in-progress: true
jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Pull vault (products + state)
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          git clone --depth 1 https://x-access-token:${VAULT_TOKEN}@github.com/anaschaabi28-del/anastore-vault.git vault
          cp vault/*.zip vault/*.jpg vault/config.json vault/orders.json .
      - name: Run store cycle
        env:
          ANASTORE_TOKEN: ${{ secrets.ANASTORE_TOKEN }}
        run: |
          sleep 25
          python3 bot.py --cycle
      - name: Save state back to vault
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          cp orders.json vault/orders.json
          cd vault
          git config user.name "anastore-bot"
          git config user.email "anastore-bot@users.noreply.github.com"
          git add orders.json
          git diff --cached --quiet || (git commit -m "state: $(date -u +%FT%TZ)" && git push origin main)
      - name: Keep the chain alive (trigger next cycle)
        if: always()
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${VAULT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/anaschaabi28-del/anastore-runner/actions/workflows/store.yml/dispatches \
            -d '{"ref":"main"}' || true
